# Watch Party - Spring Boot configuration
# كل القيم الحساسة تأتي من متغيرات البيئة فقط. لا تضع أسرار Supabase هنا.

spring.application.name=watch-party
info.app.version=${APP_VERSION:dev}
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

# -----------------------------------------------------------------------------
# Supabase PostgreSQL عبر Connection Pooler
# -----------------------------------------------------------------------------
# مثال للصيغة المطلوبة في متغير البيئة SPRING_DATASOURCE_URL:
# jdbc:postgresql://<POOLER_HOST>:6543/postgres?sslmode=require
#
# القيم التالية يجب أن تأتي من البيئة:
# - SPRING_DATASOURCE_URL
# - SPRING_DATASOURCE_USERNAME
# - SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# إعدادات HikariCP مناسبة لبداية صغيرة، ويمكن رفعها لاحقًا حسب عدد الغرف.
spring.datasource.hikari.pool-name=WatchPartySupabasePool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
# القيمة -1 تمنع فشل تشغيل التطبيق عند غياب قاعدة محلية؛ /health سيعرض DOWN بدل سقوط التطبيق.
spring.datasource.hikari.initialization-fail-timeout=${DB_INIT_FAIL_TIMEOUT_MS:-1}
spring.datasource.hikari.connection-test-query=select 1

# لا ننشئ الجداول من Hibernate لأن schema.sql في Supabase هو المصدر الرسمي للمخطط.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=public
spring.sql.init.mode=never

# -----------------------------------------------------------------------------
# Supabase Auth / API
# -----------------------------------------------------------------------------
# SUPABASE_ANON_KEY ليس سرًا مثل service_role، لكننا لا نكتبه في المستودع التزامًا بقاعدة المتغيرات.
# SUPABASE_JWT_SECRET سر حساس جدًا وسيُستخدم في المرحلة 6 للتحقق من JWT.
watchparty.supabase.url=${SUPABASE_URL:}
watchparty.supabase.anon-key=${SUPABASE_ANON_KEY:}
watchparty.supabase.jwt-secret=${SUPABASE_JWT_SECRET:}

# -----------------------------------------------------------------------------
# إعدادات عامة ستُستخدم لاحقًا في WebRTC و CORS
# -----------------------------------------------------------------------------
watchparty.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,https://*.e2b.app}
watchparty.webrtc.stun-urls=${WEBRTC_STUN_URLS:stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
watchparty.webrtc.turn-urls=${WEBRTC_TURN_URLS:}
watchparty.webrtc.turn-username=${WEBRTC_TURN_USERNAME:}
watchparty.webrtc.turn-password=${WEBRTC_TURN_PASSWORD:}

# Actuator داخلي للمراقبة، أما endpoint المطلوب للمشروع فهو /health.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# رسائل أخطاء واضحة أثناء التطوير بدون كشف stacktrace للمستخدم.
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

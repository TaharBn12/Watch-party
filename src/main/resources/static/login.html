<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تسجيل الدخول إلى Watch Party عبر Supabase أو الدخول كضيف.">
    <title>الدخول | Watch Party</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body data-page="login">
<header class="site-header compact-header">
    <a class="brand" href="/index.html">
        <span class="brand-mark">▶</span>
        <span>Watch Party</span>
    </a>
    <div class="auth-actions">
        <a class="btn btn-ghost" href="/index.html">الرئيسية</a>
    </div>
</header>

<main class="auth-layout">
    <section class="auth-card card">
        <div class="section-heading center">
            <p class="eyebrow">حسابك</p>
            <h1>ادخل إلى سهرة المشاهدة</h1>
            <p>يمكنك استخدام بريدك الإلكتروني أو الدخول كضيف باسم مستعار.</p>
        </div>

        <div class="tabs" role="tablist" aria-label="طرق الدخول">
            <button class="tab-button active" type="button" data-tab="loginPanel" role="tab" aria-selected="true">دخول</button>
            <button class="tab-button" type="button" data-tab="signupPanel" role="tab" aria-selected="false">تسجيل</button>
            <button class="tab-button" type="button" data-tab="guestPanel" role="tab" aria-selected="false">ضيف</button>
        </div>

        <section id="loginPanel" class="tab-panel active" role="tabpanel">
            <form id="loginForm" class="form-stack">
                <label>
                    <span>البريد الإلكتروني</span>
                    <input name="email" type="email" required autocomplete="email" placeholder="you@example.com">
                </label>
                <label>
                    <span>كلمة المرور</span>
                    <input name="password" type="password" required minlength="6" autocomplete="current-password" placeholder="••••••••">
                </label>
                <button class="btn btn-primary btn-block" type="submit">دخول</button>
            </form>
        </section>

        <section id="signupPanel" class="tab-panel" role="tabpanel" hidden>
            <form id="signupForm" class="form-stack">
                <label>
                    <span>الاسم الظاهر</span>
                    <input name="displayName" type="text" required minlength="1" maxlength="80" autocomplete="name" placeholder="مثال: ندى">
                </label>
                <label>
                    <span>البريد الإلكتروني</span>
                    <input name="email" type="email" required autocomplete="email" placeholder="you@example.com">
                </label>
                <label>
                    <span>كلمة المرور</span>
                    <input name="password" type="password" required minlength="6" autocomplete="new-password" placeholder="6 أحرف على الأقل">
                </label>
                <button class="btn btn-primary btn-block" type="submit">إنشاء حساب</button>
            </form>
        </section>

        <section id="guestPanel" class="tab-panel" role="tabpanel" hidden>
            <form id="guestForm" class="form-stack">
                <label>
                    <span>اسم مستعار</span>
                    <input name="displayName" type="text" required minlength="1" maxlength="80" autocomplete="nickname" placeholder="ضيف لطيف">
                </label>
                <p class="hint">
                    الدخول كضيف يستخدم Supabase Anonymous Auth. إن لم تكن مفعّلة في مشروعك، ستظهر رسالة تطلب تفعيلها.
                </p>
                <button class="btn btn-secondary btn-block" type="submit">دخول كضيف</button>
            </form>
        </section>

        <div id="authStateBox" class="state-box hidden" aria-live="polite"></div>
    </section>
</main>

<div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/login.js"></script>
</body>
</html>

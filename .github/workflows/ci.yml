name: CI

on:
  push:
    branches:
      - arena/01a0f706-watch-party
      - main
  pull_request:
    branches:
      - main
      - arena/01a0f706-watch-party

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js for static JS syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          for file in src/main/resources/static/assets/js/*.js; do
            node --check "$file"
          done

      - name: Run Maven tests
        run: mvn -B test

      - name: Package application
        run: mvn -B -DskipTests package
